name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brno
          POSTGRES_PASSWORD: brno
          POSTGRES_DB: brno_re_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://brno:brno@localhost:5432/brno_re_test
      DATABASE_URL: postgresql+psycopg://brno:brno@localhost:5432/brno_re_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest
      - name: Pipeline end to end
        run: python -m src.pipeline
