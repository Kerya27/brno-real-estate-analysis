services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brno}
      POSTGRES_DB: ${POSTGRES_DB:-brno_re}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brno} -d ${POSTGRES_DB:-brno_re}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot job: raw -> clean -> Postgres (raw/clean/mart) -> SQL queries -> models
  pipeline:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-brno}:${POSTGRES_PASSWORD:-brno}@db:5432/${POSTGRES_DB:-brno_re}
    volumes:
      - ./data/processed:/app/data/processed
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  dashboard:
    build: .
    command: ["streamlit", "run", "app/dashboard.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-brno}:${POSTGRES_PASSWORD:-brno}@db:5432/${POSTGRES_DB:-brno_re}
    ports:
      - "8501:8501"
    depends_on:
      pipeline:
        condition: service_completed_successfully

volumes:
  pgdata:
